<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · ClassPilot</title>
    <style>
      :root { --bg: #f0eef6; --ink: #151221; --muted: #785472; --brand: #554686; --on-brand: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f0c17; --ink: #f0eef6; --muted: #a69bca; --brand: #8879b9; --on-brand: #0f0c17; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 6px; }
      p { color: var(--muted); margin: 0 0 20px; font-size: 15px; }
      button { background: var(--brand); color: var(--on-brand); border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/192" alt="" />
      <h1>You're offline</h1>
      <p>ClassPilot needs an internet connection to load your class data.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
